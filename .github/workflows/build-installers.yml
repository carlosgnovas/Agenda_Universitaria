name: Generar instaladores de Agenda Universitaria

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: deb
            artifact: Debian-DEB
            path: src-tauri/target/release/bundle/deb/*.deb
          - os: windows-latest
            bundle: nsis
            artifact: Windows-EXE
            path: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Instalar paquetes npm
        run: npm install
      - name: Verificar tipos TypeScript
        run: npm run check
      - name: Ejecutar pruebas lógicas
        run: npm run test:logic
      - name: Generar instalador
        run: npm run desktop:build -- --bundles ${{ matrix.bundle }}
      - name: Descargar instalador desde la pestaña Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
